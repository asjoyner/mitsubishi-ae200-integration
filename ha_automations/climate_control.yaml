input_number:
  hvac_target_temp:
    name: "HVAC Target Temperature"
    min: 65
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer
    # No `initial:`. It used to be 72, which HA re-applies on EVERY restart,
    # silently discarding whatever the operator had set -- the same trap that
    # was removed from the two control booleans. Verified safe before removing:
    # .storage/core.restore_state holds a value for this entity, so it restores
    # the last setting rather than coming up at `min:` (65), which is the
    # failure direction a YAML input_number takes with nothing stored.

  # The setpoint this loop decided on for each zone, written every cycle
  # whether or not it had to be sent. Without it the only setpoint in
  # Prometheus is the one read back from the equipment, so "did the unit
  # accept what we commanded" cannot be asked -- which is how UPSTAIRS held
  # 74.3 F against a commanded 69 F for weeks while every series agreed.
  #
  # Comparing the read-back against the house target instead cannot be made
  # tight: this loop deliberately writes target +/-1 F, the AE-200 stores
  # 0.5 C steps, and its 2.0 C minimum split between SetTemp1 and SetTemp2
  # can pull the active slot one further step, so 2.0 F of disagreement is
  # legitimate. Against this value the tolerance is just the storage step.
  #
  # No `initial:`, for the same reason as hvac_target_temp above.
  vault_hvac_desired_setpoint:
    name: "Vault HVAC Desired Setpoint"
    min: 61
    max: 86
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
  main_south_hvac_desired_setpoint:
    name: "Main Level Left HVAC Desired Setpoint"
    min: 61
    max: 86
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
  upstairs_hvac_desired_setpoint:
    name: "Upstairs HVAC Desired Setpoint"
    min: 61
    max: 86
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
  basement_hvac_desired_setpoint:
    name: "Downstairs HVAC Desired Setpoint"
    min: 61
    max: 86
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
  main_north_hvac_desired_setpoint:
    name: "Master Bedroom HVAC Desired Setpoint"
    min: 61
    max: 86
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up

input_boolean:
  # No `initial:` on either of these, so they restore their last state across a
  # restart. They used to be pinned (climate_control false, temp_control true),
  # which meant every HA restart silently switched the whole loop OFF and left
  # the house uncontrolled with nothing to say so -- the master gate was found
  # off since 2026-04-28 that way. Safety comes from the availability guards and
  # zone_temp_valid, not from forgetting the operator's last decision.
  hvac_climate_control:
    name: "HVAC Climate Control"
    icon: mdi:thermostat-auto
  hvac_temp_control:
    name: "HVAC Temperature Control"
    icon: mdi:thermometer-check

automation:
  - alias: "Climate: Unified Climate Control"
    id: unified_climate_control
    description: >
      Evaluates every 60s to manage temperature, CO2, and humidity across all
      HVAC zones. Fan speed = max(temp_demand, co2_demand, humidity_demand).
    mode: single

    variables:
      # Fan level ordering for max() comparisons
      fan_levels:
        Auto: 0
        Low: 1
        High: 2
        Max: 3
      fan_names: ["Auto", "Low", "High", "Max"]

      zones:
        - name: "Vault"
          label: "hvac-vault"
          climate: "climate.mitsubishi_ae_200_geothermal_vault"
          slug: "vault"
          avg_temp: "sensor.vault_hvac_control_temp"
          fan_stages: 4
          erv: null
          humidifier: null
          dehumidifier: null
          dehum_on_threshold: null
          dehum_off_threshold: null
        - name: "Main Level Left"
          label: "hvac-main-south"
          climate: "climate.mitsubishi_ae_200_geothermal_main_level_left"
          slug: "main_south"
          avg_temp: "sensor.main_south_hvac_control_temp"
          fan_stages: 4
          erv: "switch.erv_main"
          humidifier: "switch.humidifier"
          dehumidifier: "switch.dehumidifier_main"
          dehum_on_threshold: 60
          dehum_off_threshold: 55
        - name: "Upstairs"
          label: "hvac-upstairs"
          climate: "climate.mitsubishi_ae_200_geothermal_upstairs"
          slug: "upstairs"
          avg_temp: "sensor.upstairs_hvac_control_temp"
          fan_stages: 4
          erv: "switch.erv_upstairs"
          humidifier: "switch.humidifier"
          dehumidifier: null
          dehum_on_threshold: null
          dehum_off_threshold: null
        - name: "Downstairs"
          label: "hvac-basement"
          climate: "climate.mitsubishi_ae_200_geothermal_downstairs"
          slug: "basement"
          avg_temp: "sensor.basement_hvac_control_temp"
          fan_stages: 4
          erv: null
          humidifier: "switch.humidifier"
          dehumidifier: "switch.dehumidifier_basement"
          dehum_on_threshold: 55
          dehum_off_threshold: 50
        - name: "Master Bedroom"
          label: "hvac-main-north"
          climate: "climate.mitsubishi_ae_200_geothermal_master_bedroom"
          slug: "main_north"
          avg_temp: "sensor.main_north_hvac_control_temp"
          fan_stages: 3
          erv: null
          humidifier: "switch.humidifier"
          dehumidifier: null
          dehum_on_threshold: null
          dehum_off_threshold: null

      # Whole-house humidity state (computed once, used by all zones)
      indoor_avg_humidity: >
        {{ states('sensor.indoor_average_humidity') | float(50) }}

      any_sensor_over_55: >
        {% set thresh = 55 %}
        {% set zone_labels = ['hvac-basement', 'hvac-main-north', 'hvac-main-south', 'hvac-upstairs'] %}
        {% set ns = namespace(too_high=false) %}
        {% for label in zone_labels %}
          {% set ids = label_devices(label) | map('device_entities') | sum(start=[]) | select('match', 'sensor\..*sht4x.*humidity') | list %}
          {% if expand(ids) | map(attribute='state') | select('is_number') | map('float') | select('gt', thresh) | list | count > 0 %}
            {% set ns.too_high = true %}
          {% endif %}
        {% endfor %}
        {{ ns.too_high }}

      target_f: "{{ states('input_number.hvac_target_temp') | float(72) }}"
      temp_control_on: "{{ is_state('input_boolean.hvac_temp_control', 'on') }}"

    trigger:
      - platform: time_pattern
        minutes: "/1"

    condition:
      - condition: state
        entity_id: input_boolean.hvac_climate_control
        state: "on"

    action:
      # --- Whole-house humidifier (evaluate once, not per-zone) ---
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ indoor_avg_humidity | float < 45 and not (any_sensor_over_55 | bool) }}
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.humidifier
          - conditions:
              - condition: template
                value_template: >
                  {{ indoor_avg_humidity | float > 50 or (any_sensor_over_55 | bool) }}
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.humidifier

      # --- Per-zone control ---
      - repeat:
          for_each: "{{ zones }}"
          sequence:
            - variables:
                zone: "{{ repeat.item }}"
                zone_name: "{{ repeat.item.name }}"
                zone_label: "{{ repeat.item.label }}"
                zone_climate: "{{ repeat.item.climate }}"
                zone_avg_temp_entity: "{{ repeat.item.avg_temp }}"
                zone_fan_stages: "{{ repeat.item.fan_stages | int }}"
                zone_erv: "{{ repeat.item.erv }}"
                zone_dehumidifier: "{{ repeat.item.dehumidifier }}"
                zone_dehum_on: "{{ repeat.item.dehum_on_threshold }}"
                zone_dehum_off: "{{ repeat.item.dehum_off_threshold }}"

                # Current zone state
                zone_avg_temp: >
                  {{ states(repeat.item.avg_temp) | float(0) }}
                # Never act on a missing or implausible reading. states() of an
                # unavailable sensor is the STRING "unavailable", and the float(0)
                # above would turn that into 0 F -- which reads as "freezing" and
                # would command full heat on every zone at once, since all five
                # now share the AE-200 as their source.
                zone_temp_valid: >
                  {% set v = states(repeat.item.avg_temp) %}
                  {{ v is not none
                     and v not in ['unknown', 'unavailable', 'none', '']
                     and v | is_number
                     and (v | float) > 40 and (v | float) < 100 }}
                current_mode: >
                  {{ state_attr(repeat.item.climate, 'hvac_mode') | default(states(repeat.item.climate), true) }}
                current_fan: >
                  {{ state_attr(repeat.item.climate, 'fan_mode') | default('Auto', true) }}
                current_setpoint: >
                  {{ state_attr(repeat.item.climate, 'temperature') | float(0) }}

                # --- CO2: max reading from SCD4x sensors in zone ---
                zone_max_co2: >
                  {% set ids = label_devices(repeat.item.label) | map('device_entities') | sum(start=[]) | select('match', 'sensor\..*scd4x_co2') | list %}
                  {% set vals = expand(ids) | map(attribute='state') | select('is_number') | map('float') | list %}
                  {{ vals | max | default(0) }}
                zone_has_co2: >
                  {% set ids = label_devices(repeat.item.label) | map('device_entities') | sum(start=[]) | select('match', 'sensor\..*scd4x_co2') | list %}
                  {{ ids | count > 0 }}

                # --- Intra-zone temperature spread ---
                zone_temp_spread: >
                  {% set ids = label_devices(repeat.item.label) | map('device_entities') | sum(start=[]) | select('match', 'sensor\..*sht4x.*') | list %}
                  {% set vals = expand(ids) | selectattr('attributes.device_class', 'defined') | selectattr('attributes.device_class', 'eq', 'temperature') | map(attribute='state') | select('is_number') | map('float') | list %}
                  {% if vals | count > 1 %}
                    {{ vals | max - vals | min }}
                  {% else %}
                    {{ 0 }}
                  {% endif %}

                # --- Zone humidity average (raw; see the note by the
                # diagnostic sensor on why it is NOT temperature-corrected) ---
                zone_avg_humidity: >
                  {% set ids = label_devices(repeat.item.label) | map('device_entities') | sum(start=[]) | select('match', 'sensor\..*sht4x.*') | list %}
                  {% set vals = expand(ids) | selectattr('attributes.device_class', 'defined') | selectattr('attributes.device_class', 'eq', 'humidity') | map(attribute='state') | select('is_number') | map('float') | list %}
                  {% if vals | count > 0 %}
                    {{ (vals | sum / vals | count) | round(1) }}
                  {% else %}
                    {{ 50 }}
                  {% endif %}

                zone_any_humidity_under_40: >
                  {% set thresh = 40 %}
                  {% set ids = label_devices(repeat.item.label) | map('device_entities') | sum(start=[]) | select('match', 'sensor\..*sht4x.*humidity') | list %}
                  {{ expand(ids) | map(attribute='state') | select('is_number') | map('float') | select('lt', thresh) | list | count > 0 }}

                # ===== TEMPERATURE DEMAND =====
                # Setpoint delta (how far avg is from target)
                setpoint_delta: >
                  {{ (zone_avg_temp | float - target_f | float) | abs }}

                # Temperature score = setpoint delta only.
                #
                # This used to be max(setpoint_delta, zone_temp_spread), to run
                # the fan harder when rooms within a zone disagreed. That is a
                # sound idea but zone_temp_spread is not usable in absolute °F:
                # it is measured between SHT45s that the FP2 sensors heat by
                # DIFFERENT amounts, so most of the spread is bias variance
                # rather than real air temperature difference. Measured
                # 2026-11-08 with every zone within 2 °F of target, the spread
                # term was 4.5-7.4 °F and pinned all four instrumented zones to
                # Max fan continuously; Vault escaped only because it has no
                # SHT45s. Master Bedroom showed 69.3-76.7 °F against 70 °F
                # return air -- a 7.4 °F "spread" over air that is not stratified
                # that much.
                #
                # zone_temp_spread is still computed below for dashboards and
                # diagnostics. To put it back into fan demand, first establish a
                # per-sensor offset against return air, or relocate the FP2s so
                # the SHT45s read room air (the revised board has landed only in
                # the master closet so far).
                # Is the unit, as currently commanded, able to act on the delta
                # at all? An indoor unit runs when its setpoint is on the
                # demanding side of the room; parked the other way it is
                # thermo-off and the fan is the only thing still moving.
                #
                # This exists because temp_score below is a pure distance from
                # target and does not care whether the zone can close that
                # distance. A zone held in the wrong mode by the dwell or the
                # mode band therefore got a High or Max fan for doing nothing,
                # which on heat recovery means blowing warm air at a room that
                # is already over target. Measured on the Vault 2026-11-09:
                # heat / setpoint 69 / return air 72 / fan High / temp_score 2.
                #
                # Falls back to the current mode and setpoint rather than the
                # desired ones because those are defined further down; one
                # 60 s cycle of lag is irrelevant against a house thermal time
                # constant in hours, and matching what the equipment is doing
                # right now is the question being asked anyway.
                zone_acting: >
                  {% set ctrl = zone_avg_temp | float %}
                  {% set sp = current_setpoint | float(0) %}
                  {% if sp <= 0 or not (zone_temp_valid | bool) %}
                    {{ false }}
                  {% elif current_mode == 'cool' %}
                    {{ sp < ctrl - 0.3 }}
                  {% elif current_mode == 'heat' %}
                    {{ sp > ctrl + 0.3 }}
                  {% else %}
                    {{ true }}
                  {% endif %}

                temp_score: >
                  {{ (zone_avg_temp | float - target_f | float) | abs }}

                # Temperature fan demand (numeric level)
                temp_fan_level: >
                  {% set score = temp_score | float %}
                  {% set stages = zone_fan_stages | int %}
                  {% if not (temp_control_on | bool) or not (zone_temp_valid | bool)
                        or not (zone_acting | bool) %}
                    {{ 0 }}
                  {% elif stages == 4 %}
                    {% if score < 1 %}{{ 0 }}
                    {% elif score < 2 %}{{ 1 }}
                    {% elif score < 3 %}{{ 2 }}
                    {% else %}{{ 3 }}
                    {% endif %}
                  {% elif stages == 3 %}
                    {% if score < 1 %}{{ 0 }}
                    {% elif score < 2.5 %}{{ 2 }}
                    {% else %}{{ 3 }}
                    {% endif %}
                  {% else %}
                    {{ 0 }}
                  {% endif %}

                # Desired HVAC mode.
                #
                # The mode band (+/-2) is deliberately WIDER than the setpoint
                # overshoot (+/-1, below). It has to be: the AE-200 drives the
                # room to whatever setpoint we hand it, so if the commanded
                # extreme sits outside the mode band, every approach ends by
                # crossing the opposite mode threshold and the loop is
                # GUARANTEED to flip heat <-> cool forever.
                #
                # That is exactly what happened on 2026-11-08 with a +/-1 mode
                # band and a +/-2 overshoot. Main Level Left: cool/69.8 pulled
                # the room to 70.7 (below 71.0) -> heat/74.3 -> heated to 73.4
                # (above 73.0) -> cool/69.8, four flips in 73 min and three
                # AE200ZoneOutOfComfortBand pages. Downstairs swung 9.2 F in 3 h
                # and flipped ten times. The 15 min smoothing cut the setpoint
                # chatter but could not fix this: the flips are not noise, they
                # are the loop tracking a target it was told to overshoot.
                #
                # So: 1 F of margin between the commanded extreme and the mode
                # threshold, and heat <-> cool additionally held for 60 min
                # after the last mode change, as a backstop for whatever this
                # reasoning has missed.
                #
                # `mode_dwell_ok` uses the climate entity's own last_changed,
                # which for a climate entity IS the last mode change (state is
                # the hvac mode; attribute updates only bump last_updated). It
                # needs no helper and it also sees changes made from the AE-200
                # panel or the HA UI. After an HA restart last_changed is the
                # restart time, so mode changes are held for the first hour;
                # that is the safe direction and the smoothed inputs are
                # unavailable for the first 15 min anyway.
                #
                # While a flip is held, the setpoint template below still writes
                # for the direction the room actually needs, which lands on the
                # wrong side of the held mode -- heat with a setpoint under the
                # room, or cool with one over it.
                #
                # This comment used to claim such a zone merely "coasts". That
                # was WRONG, and Aaron caught it from the room: the Vault was
                # pouring out hot air in `heat` with a 69 F setpoint against
                # 72 F return air. Thermo-off stops the unit's own call, but on
                # R2 heat recovery the coil still has warm refrigerant in it
                # whenever other zones are rejecting heat, and this loop was
                # commanding fan High at the time (see zone_acting below). A
                # held zone is therefore not harmless; it is only as harmless
                # as its fan. Holding a mode and running its fan hard are a
                # contradiction.
                # The 60 min dwell must not become the failure itself. While a
                # flip is held the zone coasts, so a load that keeps pushing it
                # would be ignored for up to an hour -- and at a 72 F target,
                # 30 min anywhere above 73 F is an AE200ZoneOutOfComfortBand
                # page. Past 3 F from target the excursion is larger than
                # anything this loop's own overshoot can cause, so it is real
                # and the dwell gives way. That bounds a coast at target +/-3
                # instead of leaving it open-ended.
                mode_dwell_ok: >
                  {% set st = states[repeat.item.climate] %}
                  {% set lc = st.last_changed if st is not none else none %}
                  {{ lc is none or (now() - lc).total_seconds() >= 3600 }}
                desired_mode: >
                  {% set avg = zone_avg_temp | float %}
                  {% set tgt = target_f | float %}
                  {% set cur = current_mode %}
                  {% set flip = cur in ['heat', 'cool'] %}
                  {% set may = mode_dwell_ok | bool or not flip
                               or avg < tgt - 3 or avg > tgt + 3 %}
                  {% if not (temp_control_on | bool) %}
                    heat_cool
                  {% elif avg < tgt - 2 and may %}
                    heat
                  {% elif avg > tgt + 2 and may %}
                    cool
                  {% elif flip %}
                    {{ cur }}
                  {% elif cur == 'heat_cool' %}
                    {{ 'heat' if avg < tgt else 'cool' }}
                  {% else %}
                    {{ cur }}
                  {% endif %}

                # Desired setpoint in °F -- HA's configured unit, NOT Celsius.
                #
                # climate.set_temperature takes the value in HA's unit system
                # (°F here). The mitsubishi_ae200 integration is native Celsius
                # and HA converts on the way in, so passing Celsius made HA
                # convert a second time: 74 F -> 23.3 -> -4.8 C, which the
                # integration rejected as outside its 16-30 C range. Every
                # setpoint write failed that way while the unitless mode and
                # fan writes went through, which is why the automation looked
                # half-alive. Fixed 2026-11-08.
                #
                # °F also matches current_setpoint below, which reads the
                # climate entity's `temperature` attribute (HA-converted to °F);
                # comparing Celsius against that never matched, so a doomed
                # write was retried every 60 s.
                #
                # Clamped to the entity's own advertised limits rather than
                # hardcoded numbers (AE-200 reports 61-86 F).
                # Inside the dead band the setpoint returns to the target,
                # it does NOT stop being written. Writing 0 (= "no write") here
                # latched the overshoot: on 2026-11-08 the Vault's return air
                # touched 70 F for one 60 s cycle, took mode=heat / setpoint=74,
                # and then sat at 70-73 F for four hours with nothing to walk 74
                # back. Because the inlet reads in whole °F and the comparisons
                # are strict, the only exit was for the room to actually reach
                # 74 and flip to cool/70 -- a 4 F peak-to-peak swing, and four
                # zones holding cool/70 against one holding heat/74 while every
                # zone was already within 1 F of target.
                #
                # The overshoot is still there for the approach, so the VRF
                # is driven hard while the zone is away from target and then told
                # the target once it arrives. 0 now means only "temp control is
                # off, leave the setpoints alone", which is what the write block
                # below guards on.
                #
                # It is +/-1, not +/-2. The size of this number is not a comfort
                # or an aggression setting: it is the furthest the equipment will
                # be asked to carry the room past target, and it MUST stay
                # strictly inside the +/-2 mode band above or the loop oscillates
                # by construction (see desired_mode). Anyone widening it has to
                # widen the mode band first. Approach aggression lives in
                # temp_fan_level, which already scales with the distance to
                # target; it does not need to live here as well.
                #
                # +/-1 also keeps the room inside the 65-73 F band that
                # AE200ZoneOutOfComfortBand pages on: at a 72 F target the
                # commanded extremes are 71 and 73, where +/-2 commanded 74.
                #
                # HYSTERESIS. Engage the overshoot at +/-1 F past target,
                # release it when the zone actually reaches target, and do not
                # re-engage until +/-1 F is crossed again. The engage and
                # release points have to differ or the setpoint rattles on the
                # boundary, which is what snapping straight back to target did:
                # 7-9 setpoint changes an hour on the two noisy zones.
                #
                # `current_setpoint` is the state that says whether we are
                # already engaged, compared with a 0.5 F tolerance because the
                # AE-200 stores 0.5 C steps and rounds what we write.
                desired_setpoint_f: >
                  {% set tgt = target_f | float %}
                  {% set avg = zone_avg_temp | float %}
                  {% set lo = state_attr(repeat.item.climate, 'min_temp') | float(61) %}
                  {% set hi = state_attr(repeat.item.climate, 'max_temp') | float(86) %}
                  {% set sp = current_setpoint | float(0) %}
                  {% set heating = (sp - (tgt + 1)) | abs < 0.5 %}
                  {% set cooling = (sp - (tgt - 1)) | abs < 0.5 %}
                  {% if not (temp_control_on | bool) %}
                    {{ 0 }}
                  {% elif avg < tgt - 1 or (heating and avg < tgt) %}
                    {{ [[tgt + 1, lo] | max, hi] | min }}
                  {% elif avg > tgt + 1 or (cooling and avg > tgt) %}
                    {{ [[tgt - 1, lo] | max, hi] | min }}
                  {% else %}
                    {{ [[tgt, lo] | max, hi] | min }}
                  {% endif %}

                # Desired setpoints for heat_cool mode, also in °F.
                # Currently unreferenced; kept in °F so they are not a trap.
                desired_setpoint_high_f: >
                  {% set hi = state_attr(repeat.item.climate, 'max_temp') | float(86) %}
                  {{ [target_f | float + 2, hi] | min }}
                desired_setpoint_low_f: >
                  {% set lo = state_attr(repeat.item.climate, 'min_temp') | float(61) %}
                  {{ [target_f | float - 2, lo] | max }}

                # ===== CO2 DEMAND =====
                co2_fan_level: >
                  {% set co2 = zone_max_co2 | float %}
                  {% set has_co2 = zone_has_co2 | bool(false) %}
                  {% if not has_co2 %}
                    {{ 0 }}
                  {% elif co2 > 800 %}
                    {{ 3 }}
                  {% elif co2 > 600 %}
                    {{ 2 }}
                  {% else %}
                    {{ 0 }}
                  {% endif %}

                # Desired ERV state
                desired_erv: >
                  {% if zone_erv in [None, 'None', 'null', ''] %}
                    none
                  {% elif zone_max_co2 | float > 800 %}
                    on
                  {% elif zone_max_co2 | float < 600 %}
                    off
                  {% else %}
                    {{ states(zone_erv) | default('off') }}
                  {% endif %}

                # ===== HUMIDITY DEMAND =====
                humidity_fan_level: >
                  {% set dehum = repeat.item.dehumidifier %}
                  {% set hum = repeat.item.humidifier %}
                  {% set dehum_active = dehum not in [None, 'None', 'null', ''] and is_state(dehum, 'on') %}
                  {% set hum_active = hum not in [None, 'None', 'null', ''] and is_state(hum, 'on') %}
                  {% if dehum_active or hum_active %}
                    {{ 1 }}
                  {% else %}
                    {{ 0 }}
                  {% endif %}

                # ===== FINAL FAN SPEED =====
                final_fan_level: >
                  {{ [temp_fan_level | int, co2_fan_level | int, humidity_fan_level | int] | max }}
                desired_fan: >
                  {{ fan_names[([temp_fan_level | int, co2_fan_level | int, humidity_fan_level | int] | max)] }}

            # --- Send mode command if changed (only when temp control is active) ---
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ (temp_control_on | bool) and (zone_temp_valid | bool)
                           and desired_mode != current_mode }}
                  sequence:
                    - action: climate.set_hvac_mode
                      continue_on_error: true
                      target:
                        entity_id: "{{ zone_climate }}"
                      data:
                        hvac_mode: "{{ desired_mode }}"

            # --- Publish the commanded setpoint for monitoring ---
            # Written every cycle, including inside the dead band where no
            # command is sent, so the series says what we want the zone to
            # hold rather than what we last had to write. Skipped when temp
            # control is off, where desired_setpoint_f is the 0 sentinel and
            # out of the helper's range; gate any rule on
            # input_boolean.hvac_temp_control.
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ (temp_control_on | bool) and (zone_temp_valid | bool)
                           and desired_setpoint_f | float(0) > 0 }}
                  sequence:
                    - action: input_number.set_value
                      continue_on_error: true
                      target:
                        entity_id: >
                          input_number.{{ repeat.item.slug }}_hvac_desired_setpoint
                      data:
                        value: "{{ desired_setpoint_f | float | round(1) }}"

            # --- Send setpoint command ---
            - choose:
                # Temp control ON and outside dead band: single setpoint
                - conditions:
                    - condition: template
                      value_template: >
                        {{ (temp_control_on | bool) and (zone_temp_valid | bool)
                           and desired_setpoint_f | float > 0
                           and ((desired_setpoint_f | float) - (current_setpoint | float(0))) | abs >= 0.5 }}
                  sequence:
                    - action: climate.set_temperature
                      continue_on_error: true
                      target:
                        entity_id: "{{ zone_climate }}"
                      data:
                        temperature: "{{ desired_setpoint_f | float | round(1) }}"
                # Temp control OFF: leave setpoints alone for manual control

            # --- Send fan speed command if changed ---
            # fan_modes is checked, not just compared: a unit that came up
            # without its capability flags reports no fan modes at all, and
            # calling set_fan_mode on it raises ServiceNotSupported. On
            # 2026-11-10 that error aborted the run every minute and the
            # zones after the failing one went unwritten for 37 minutes.
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {% set fan_modes = state_attr(repeat.item.climate, 'fan_modes') %}
                        {{ desired_fan != current_fan
                           and fan_modes is not none
                           and desired_fan in fan_modes }}
                  sequence:
                    - action: climate.set_fan_mode
                      continue_on_error: true
                      target:
                        entity_id: "{{ zone_climate }}"
                      data:
                        fan_mode: "{{ desired_fan }}"

            # --- ERV control ---
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ desired_erv == 'on' and not is_state(zone_erv, 'on') }}
                  sequence:
                    - action: switch.turn_on
                      target:
                        entity_id: "{{ zone_erv }}"
                - conditions:
                    - condition: template
                      value_template: >
                        {{ desired_erv == 'off' and is_state(zone_erv, 'on') }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ zone_erv }}"

            # --- Dehumidifier control (per-zone) ---
            - choose:
                # Turn ON: zone avg > threshold and no sensor too dry
                - conditions:
                    - condition: template
                      value_template: >
                        {% set dehum = zone_dehumidifier %}
                        {{ dehum not in [None, 'None', 'null', '']
                           and zone_avg_humidity | float > zone_dehum_on | float
                           and not (zone_any_humidity_under_40 | bool) }}
                  sequence:
                    - action: switch.turn_on
                      target:
                        entity_id: "{{ zone_dehumidifier }}"
                # Turn OFF: zone avg < off_threshold or any sensor too dry
                - conditions:
                    - condition: template
                      value_template: >
                        {% set dehum = zone_dehumidifier %}
                        {{ dehum not in [None, 'None', 'null', '']
                           and (zone_avg_humidity | float < zone_dehum_off | float
                                or (zone_any_humidity_under_40 | bool)) }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ zone_dehumidifier }}"
