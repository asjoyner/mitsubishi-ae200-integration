# Unified Climate Control Package for Mitsubishi AE-200
#
# Manages temperature, CO2 ventilation, and humidity control across all HVAC
# zones with a single automation. Fan speed is driven by max demand across all
# subsystems. Graceful degradation: zones without CO2 sensors or
# humidifier/dehumidifier skip those subsystems automatically.
#
# Install: symlink or copy to /var/lib/hass/config/packages/climate_control/
# See README.md for full setup instructions.

# Control temperature = the AE-200 return-air (inlet) reading for each zone.
#
# This replaced the per-room SHT45 averages on 2026-11-08. Those sensors sit
# next to the FP2 presence sensors, which heat them: measured the same day they
# read +3.8 F (Master Bedroom) to +9.4 F (Downstairs) above return air. With a
# 72 F target and a 1 F dead band, four of the five zones would have commanded
# cooling the moment control was enabled. The FP2 heating is still present in
# the revised sensor design, so this is not a "wait for the new boards" fix.
#
# These deliberately go UNAVAILABLE rather than falling back to a number when
# the AE-200 stops reporting. All five zones now depend on one upstream source,
# so a silent default would drive the whole house off a bad reading; the
# automation gates on zone_temp_valid instead.
template:
  - sensor:
      - name: "Vault HVAC Return Air Temperature"
        unique_id: vault_hvac_return_air_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        availability: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_vault', 'current_temperature') is not none }}
        state: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_vault', 'current_temperature') | float }}
      - name: "Main South HVAC Return Air Temperature"
        unique_id: main_south_hvac_return_air_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        availability: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_main_level_left', 'current_temperature') is not none }}
        state: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_main_level_left', 'current_temperature') | float }}
      - name: "Upstairs HVAC Return Air Temperature"
        unique_id: upstairs_hvac_return_air_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        availability: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_upstairs', 'current_temperature') is not none }}
        state: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_upstairs', 'current_temperature') | float }}
      - name: "Basement HVAC Return Air Temperature"
        unique_id: basement_hvac_return_air_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        availability: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_downstairs', 'current_temperature') is not none }}
        state: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_downstairs', 'current_temperature') | float }}
      - name: "Main North HVAC Return Air Temperature"
        unique_id: main_north_hvac_return_air_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        availability: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_master_bedroom', 'current_temperature') is not none }}
        state: >
          {{ state_attr('climate.mitsubishi_ae_200_geothermal_master_bedroom', 'current_temperature') | float }}

# DIAGNOSTIC ONLY -- humidity control reads the raw sensor.indoor_average_humidity.
#
# Dew point, not RH, because dew point does not depend on a reference
# temperature. The SHT45s are temperature compensated to their own die, so each
# one correctly reports the RH of the air touching it; absolute moisture does
# not change when air is heated, so sensor RH + sensor temperature gives the
# air's vapour pressure directly. RH as a PERCENTAGE is the only
# temperature-dependent part, which is the sole reason anything here needs
# converting: the 45/50/55 % control thresholds implicitly mean "RH where
# people are", i.e. at return-air temperature.
#
# Measured 2026-11-08: mean vapour pressure 12.3 hPa, dew point 50.1 F. The
# same moisture is 52.7 % RH at 68 F, 49.3 % at 70 F, 46.0 % at 72 F.
#
# CAVEAT -- this number is an upper bound, and the raw RH is a lower bound.
# Across 28 sensors spanning 0 to +10.5 F of FP2 heating, the computed moisture
# rises with how heated the sensor is (r = +0.57), which cannot be physical:
# heating air does not add water. Correcting by the full reported offset also
# makes the sensors agree LESS (cross-sensor stdev 4.83 vs 3.74 when barely
# corrected). Both point the same way -- the thermistor picks up conducted heat
# through the board while the humidity polymer equilibrates with air nearer room
# temperature, so the reported temperature overstates the air at the sensing
# surface and this dew point comes out high.
#
# Fitting the fraction of the offset the RH element actually sees gives
# k = 0.16-0.34, i.e. house RH at return air of about 39-41 %, 90 % CI
# 38.1-44.4 %. That whole interval is BELOW the 45 % humidifier-ON threshold,
# and so is the raw 38.1 %, so raw and corrected call for the same action and
# control stays on the raw value rather than carry a fitted constant.
#
# Do NOT cite the attic GW3000B console (sensor.gw3000b_indoor_humidity) as
# confirmation: different location, own temperature and moisture, not a house
# average. To settle the magnitude, site one RH sensor away from an FP2 in
# occupied space and compare directly.
      - name: "Indoor Mean Dew Point"
        unique_id: indoor_mean_dew_point
        unit_of_measurement: "\u00b0F"
        device_class: temperature
        state: >
          {% set a = 17.625 %}{% set b = 243.04 %}
          {% set ns = namespace(sum=0.0, n=0) %}
          {% for s in states.sensor if s.entity_id.endswith('_sht4x_relative_humidity') %}
            {% set room = s.entity_id | replace('sensor.','') | replace('_sht4x_relative_humidity','') %}
            {% set t = states('sensor.' ~ room ~ '_sht4x_temperature') %}
            {% if s.state | is_number and t | is_number
                  and 'garage' not in room and 'outdoor' not in room %}
              {% set tc = (t | float - 32) * 5 / 9 %}
              {% set ns.sum = ns.sum + (s.state | float / 100) * 6.112 * (e ** (a * tc / (b + tc))) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {% if ns.n == 0 %}
            unavailable
          {% else %}
            {% set vp = ns.sum / ns.n %}{% set g = log(vp / 6.112) %}
            {{ ((b * g / (a - g)) * 9 / 5 + 32) | round(1) }}
          {% endif %}
        attributes:
          sensor_count: >
            {% set ns = namespace(n=0) %}
            {% for s in states.sensor if s.entity_id.endswith('_sht4x_relative_humidity') %}
              {% set room = s.entity_id | replace('sensor.','') | replace('_sht4x_relative_humidity','') %}
              {% if s.state | is_number and states('sensor.' ~ room ~ '_sht4x_temperature') | is_number
                    and 'garage' not in room and 'outdoor' not in room %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
          rh_at_return_air_upper_bound: >
            {% set a = 17.625 %}{% set b = 243.04 %}
            {% set ns = namespace(sum=0.0, n=0) %}
            {% for s in states.sensor if s.entity_id.endswith('_sht4x_relative_humidity') %}
              {% set room = s.entity_id | replace('sensor.','') | replace('_sht4x_relative_humidity','') %}
              {% set t = states('sensor.' ~ room ~ '_sht4x_temperature') %}
              {% if s.state | is_number and t | is_number
                    and 'garage' not in room and 'outdoor' not in room %}
                {% set tc = (t | float - 32) * 5 / 9 %}
                {% set ns.sum = ns.sum + (s.state | float / 100) * 6.112 * (e ** (a * tc / (b + tc))) %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {% set ret = ['sensor.vault_hvac_return_air_temperature',
                          'sensor.main_south_hvac_return_air_temperature',
                          'sensor.upstairs_hvac_return_air_temperature',
                          'sensor.basement_hvac_return_air_temperature',
                          'sensor.main_north_hvac_return_air_temperature']
                         | map('states') | select('is_number') | map('float') | list %}
            {% if ns.n == 0 or ret | count == 0 %}
              unavailable
            {% else %}
              {% set tr = ((ret | sum / ret | count) - 32) * 5 / 9 %}
              {{ (100 * (ns.sum / ns.n) / (6.112 * (e ** (a * tr / (b + tr))))) | round(1) }}
            {% endif %}
          raw_rh_lower_bound: "{{ states('sensor.indoor_average_humidity') }}"

# SMOOTHED control inputs -- these, not the raw return-air sensors, drive the
# automation.
#
# The AE-200 inlet reading arrives as whole °F (it is 0.5 °C native, rounded on
# the way through HA), and Main Level Left's is genuinely noisy: stdev 1.9 °F
# against 0.5-0.6 °F for the other zones, with spikes to +4 °F. A 1 °F dead band
# on a signal like that sits on the boundary and rattles. Measured 2026-11-08,
# in the hour after the dead band started writing the target: Main Level Left
# changed setpoint 7 times and Downstairs 9 times, cycling 70/72/74, while the
# three quiet zones changed once each. The two that chattered are exactly the
# two noisy ones.
#
# Smoothing cuts that noise and restores sub-degree resolution, so the
# comparisons below act on a trend instead of on quantisation. The lag is
# irrelevant against a house thermal time constant measured in hours.
#
# WHY THIS IS A TIME-DRIVEN EMA AND NOT THE `filter` PLATFORM
#
# It used to be five `platform: filter` time_simple_moving_average sensors.
# That was broken in a way that is invisible until it bites, and on
# 2026-11-09 it cost an AE200ZoneOutOfComfortBand page on UPSTAIRS.
#
# The filter platform recomputes ONLY from async_track_state_change_event on
# its source (homeassistant/components/filter/sensor.py: _filter_state is
# reached only from _update_filter_sensor_state). It has no timer. The source
# here is whole °F, so when a room holds still the source stops emitting
# state_changed -- and the filter output FREEZES at whatever partial average it
# last computed, for as long as the room is steady. There is no upper bound on
# how long, and no way to wake it from the source side: re-rendering a template
# sensor to an unchanged value fires EVENT_STATE_REPORTED, not
# EVENT_STATE_CHANGED (core.py async_set_internal returns early on
# same_state and same_attr), so the filter never hears it.
#
# Measured on UPSTAIRS, 2026-11-09:
#   12:54:19  source 71 -> smoothed 71.07
#   12:58:19  source 72    (smoothed does not move)
#   ... 3 h 28 min with NO update at all ...
#   16:26:20  source 73 -> smoothed 72.00
# Prometheus (0.5 °C native, finer) shows the room actually climbing
# 71.6 -> 72.5 across that gap. So the control input read 71.07 while the room
# was 72.5: stale by ~1.4 °F, in the one condition where you most need it right.
#
# Consequences, all of them real: desired_mode could not see the room cross
# target+2, so UPSTAIRS stayed parked in `heat` until 16:38 and paged at
# 73.4 °F; zone_acting, desired_setpoint_f and summer_dhw_gating's
# heating_demand were all reading the same stale number.
#
# The exponential moving average below is driven by a time_pattern, so it
# recomputes every 60 s whether or not the source moved, and converges on the
# source instead of freezing short of it. tau = 600 s (10 min) -- a little
# faster than the old nominal 15 min window, deliberately, because the fault we
# just fixed was the loop reacting LATE.
#
# dt comes from each sensor's own `computed_at` attribute rather than from
# this.last_updated or an assumed 60 s, and is clamped to [0, 900] s. The
# upper clamp lets a restart or a long HA outage re-acquire in one step
# instead of crawling back from a stale value; the lower one makes a backwards
# clock a no-op instead of a negative alpha. See the attribute's own comment
# for why it is load-bearing.
#
# These go unknown whenever the source is not a number, including until the
# first sample after a restart. That is safe and deliberate: zone_temp_valid
# rejects a non-number and no writes are sent. The next cycle reseeds straight
# from the source.
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Vault HVAC Control Temp"
        unique_id: vault_hvac_control_temp
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set src = states('sensor.vault_hvac_return_air_temperature') %}
          {% set prev = this.state | float(-999) %}
          {% set tp = this.attributes.get('computed_at', none) if this is not none else none %}
          {% if not (src | is_number) %}
            unknown
          {% elif prev < -900 or tp is none %}
            {{ src | float | round(2) }}
          {% else %}
            {% set raw = (now() - (tp | as_datetime)).total_seconds() | float %}
            {% set dt = [[raw, 900] | min, 0] | max %}
            {% set a = 1 - (e ** (-dt / 600)) %}
            {{ (prev + a * ((src | float) - prev)) | round(2) }}
          {% endif %}
        attributes:
          # LOAD-BEARING, not decoration. Two jobs:
          #  1. It is the EMA's clock. dt is measured from this, not from
          #     this.last_updated, so the average cannot be skewed by the
          #     state machine's bookkeeping.
          #  2. It changes every render, so same_attr is always False and the
          #     state is always written. Without it a converged sensor stops
          #     writing, last_updated stops advancing, dt grows to the 900 s
          #     clamp, and the next source step would be taken at alpha 0.78
          #     instead of 0.10 -- i.e. a single noise spike would pass almost
          #     unfiltered, on the zones the smoothing exists for.
          # It also makes a stalled control input visible at a glance, which is
          # the failure this whole block replaced.
          computed_at: "{{ now().isoformat() }}"
          source: "sensor.vault_hvac_return_air_temperature"
      - name: "Main South HVAC Control Temp"
        unique_id: main_south_hvac_control_temp
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set src = states('sensor.main_south_hvac_return_air_temperature') %}
          {% set prev = this.state | float(-999) %}
          {% set tp = this.attributes.get('computed_at', none) if this is not none else none %}
          {% if not (src | is_number) %}
            unknown
          {% elif prev < -900 or tp is none %}
            {{ src | float | round(2) }}
          {% else %}
            {% set raw = (now() - (tp | as_datetime)).total_seconds() | float %}
            {% set dt = [[raw, 900] | min, 0] | max %}
            {% set a = 1 - (e ** (-dt / 600)) %}
            {{ (prev + a * ((src | float) - prev)) | round(2) }}
          {% endif %}
        attributes:
          # LOAD-BEARING, not decoration. Two jobs:
          #  1. It is the EMA's clock. dt is measured from this, not from
          #     this.last_updated, so the average cannot be skewed by the
          #     state machine's bookkeeping.
          #  2. It changes every render, so same_attr is always False and the
          #     state is always written. Without it a converged sensor stops
          #     writing, last_updated stops advancing, dt grows to the 900 s
          #     clamp, and the next source step would be taken at alpha 0.78
          #     instead of 0.10 -- i.e. a single noise spike would pass almost
          #     unfiltered, on the zones the smoothing exists for.
          # It also makes a stalled control input visible at a glance, which is
          # the failure this whole block replaced.
          computed_at: "{{ now().isoformat() }}"
          source: "sensor.main_south_hvac_return_air_temperature"
      - name: "Upstairs HVAC Control Temp"
        unique_id: upstairs_hvac_control_temp
        unit_of_measurement: "°F"
        device_class: temperature
