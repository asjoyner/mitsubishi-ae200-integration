        state: >
          {% set src = states('sensor.upstairs_hvac_return_air_temperature') %}
          {% set prev = this.state | float(-999) %}
          {% set tp = this.attributes.get('computed_at', none) if this is not none else none %}
          {% if not (src | is_number) %}
            unknown
          {% elif prev < -900 or tp is none %}
            {{ src | float | round(2) }}
          {% else %}
            {% set raw = (now() - (tp | as_datetime)).total_seconds() | float %}
            {% set dt = [[raw, 900] | min, 0] | max %}
            {% set a = 1 - (e ** (-dt / 600)) %}
            {{ (prev + a * ((src | float) - prev)) | round(2) }}
          {% endif %}
        attributes:
          # LOAD-BEARING, not decoration. Two jobs:
          #  1. It is the EMA's clock. dt is measured from this, not from
          #     this.last_updated, so the average cannot be skewed by the
          #     state machine's bookkeeping.
          #  2. It changes every render, so same_attr is always False and the
          #     state is always written. Without it a converged sensor stops
          #     writing, last_updated stops advancing, dt grows to the 900 s
          #     clamp, and the next source step would be taken at alpha 0.78
          #     instead of 0.10 -- i.e. a single noise spike would pass almost
          #     unfiltered, on the zones the smoothing exists for.
          # It also makes a stalled control input visible at a glance, which is
          # the failure this whole block replaced.
          computed_at: "{{ now().isoformat() }}"
          source: "sensor.upstairs_hvac_return_air_temperature"
      - name: "Basement HVAC Control Temp"
        unique_id: basement_hvac_control_temp
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set src = states('sensor.basement_hvac_return_air_temperature') %}
          {% set prev = this.state | float(-999) %}
          {% set tp = this.attributes.get('computed_at', none) if this is not none else none %}
          {% if not (src | is_number) %}
            unknown
          {% elif prev < -900 or tp is none %}
            {{ src | float | round(2) }}
          {% else %}
            {% set raw = (now() - (tp | as_datetime)).total_seconds() | float %}
            {% set dt = [[raw, 900] | min, 0] | max %}
            {% set a = 1 - (e ** (-dt / 600)) %}
            {{ (prev + a * ((src | float) - prev)) | round(2) }}
          {% endif %}
        attributes:
          # LOAD-BEARING, not decoration. Two jobs:
          #  1. It is the EMA's clock. dt is measured from this, not from
          #     this.last_updated, so the average cannot be skewed by the
          #     state machine's bookkeeping.
          #  2. It changes every render, so same_attr is always False and the
          #     state is always written. Without it a converged sensor stops
          #     writing, last_updated stops advancing, dt grows to the 900 s
          #     clamp, and the next source step would be taken at alpha 0.78
          #     instead of 0.10 -- i.e. a single noise spike would pass almost
          #     unfiltered, on the zones the smoothing exists for.
          # It also makes a stalled control input visible at a glance, which is
          # the failure this whole block replaced.
          computed_at: "{{ now().isoformat() }}"
          source: "sensor.basement_hvac_return_air_temperature"
      - name: "Main North HVAC Control Temp"
        unique_id: main_north_hvac_control_temp
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set src = states('sensor.main_north_hvac_return_air_temperature') %}
          {% set prev = this.state | float(-999) %}
          {% set tp = this.attributes.get('computed_at', none) if this is not none else none %}
          {% if not (src | is_number) %}
            unknown
          {% elif prev < -900 or tp is none %}
            {{ src | float | round(2) }}
          {% else %}
            {% set raw = (now() - (tp | as_datetime)).total_seconds() | float %}
            {% set dt = [[raw, 900] | min, 0] | max %}
